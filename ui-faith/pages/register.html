<main class="auth-page">

  <div class="auth-wrapper">

    <div class="auth-card">

      <!-- LOGO -->
      <img
        src="/faith/assets/xynafaith.png"
        class="auth-logo"
        alt="XynaFaith Logo"
      >

      <!-- TITLE -->
      <h2>Create Your Account</h2>

      <p class="auth-sub">
        Join pastors and believers around the world.
      </p>

      <form id="registerForm">

        <!-- FULL NAME -->
        <div class="form-group">

          <label for="name">
            Full Name
          </label>

          <input
            type="text"
            id="name"
            placeholder="Enter your full name"
            autocomplete="name"
            required
          >

        </div>

        <!-- EMAIL -->
        <div class="form-group">

          <label for="email">
            Email
          </label>

          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >

        </div>

        <!-- MEMBER INFO -->
        <div class="account-info">

          <strong>
            Member Account
          </strong>

          <p>
            Every new account starts as a Member.
            You can apply to become a verified Pastor
            from your dashboard at any time.
          </p>

        </div>

        <!-- PASSWORD -->
        <div class="form-group">

          <label for="password">
            Password
          </label>

          <div class="password-wrapper">

            <input
              type="password"
              id="password"
              placeholder="Create a password"
              autocomplete="new-password"
              required
            >

            <button
              type="button"
              class="password-toggle"
            >
              👁
            </button>

          </div>

        </div>

        <!-- CONFIRM PASSWORD -->
        <div class="form-group">

          <label for="confirmPassword">
            Confirm Password
          </label>

          <div class="password-wrapper">

            <input
              type="password"
              id="confirmPassword"
              placeholder="Confirm your password"
              autocomplete="new-password"
              required
            >

            <button
              type="button"
              class="password-toggle"
            >
              👁
            </button>

          </div>

        </div>

        <!-- TERMS -->
        <div class="remember-me">

          <input
            type="checkbox"
            id="agreeTerms"
            required
          >

          <label for="agreeTerms">

            I agree to the

            <a href="#">
              Terms of Service
            </a>

          </label>

        </div>

        <!-- ERROR -->
        <p
          id="registerError"
          class="auth-error"
        ></p>

        <!-- BUTTON -->
        <button
          type="submit"
          class="btn-primary full"
        >
          Create Account
        </button>

      </form>

      <!-- FOOTER -->
      <div class="auth-footer">

        Already have an account?

        <a
          href="#"
          onclick="navigate('login')"
        >
          Log In
        </a>

      </div>

    </div>

  </div>

</main>
