<main class="auth-page">

  <div class="auth-wrapper">

    <div class="auth-card">

      <img
        src="assets/xynafaith.png"
        class="auth-logo"
        alt="XynaFaith Logo"
      >

      <h2>Welcome Back</h2>

      <p class="auth-sub">
        Continue your ministry journey with XynaFaith.
      </p>

      <form id="loginForm">

        <!-- EMAIL -->

        <div class="form-group">

          <label for="email">
            Email
          </label>

          <input
            type="email"
            id="email"
            autocomplete="email"
            placeholder="Enter your email"
            required
          >

        </div>

        <!-- PASSWORD -->

        <div class="form-group">

          <label for="password">
            Password
          </label>

          <div class="password-wrapper">

            <input
              type="password"
              id="password"
              autocomplete="current-password"
              placeholder="Enter your password"
              required
            >

            <button
              type="button"
              id="togglePassword"
              class="password-toggle"
              aria-label="Show Password"
            >
              👁
            </button>

          </div>

        </div>

        <!-- OPTIONS -->

        <div class="login-options">

          <label class="remember-me">

            <input
              type="checkbox"
              id="rememberMe"
            >

            <span>
              Remember me
            </span>

          </label>

          <a
            href="#"
            onclick="navigate('forgot-password')"
          >
            Forgot Password?
          </a>

        </div>

        <!-- ERROR -->

        <p
          id="loginError"
          class="auth-error"
        ></p>

        <!-- BUTTON -->

        <button
          id="loginButton"
          type="submit"
          class="btn-primary full"
        >
          Log In
        </button>

      </form>

      <div class="auth-footer">

        Don't have an account?

        <a
          href="#"
          onclick="navigate('register')"
        >
          Create Account
        </a>

      </div>

    </div>

  </div>

</main>
