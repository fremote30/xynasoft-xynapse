<div class="app clean-app">
  <div class="clean-main">

    <section class="xyniva-page">

      <div class="xyniva-header">
        <div class="xyniva-heading">

          <button
            type="button"
            class="xyniva-back"
            aria-label="Go back"
            title="Go back"
            onclick="navigate('sermon')"
          >
            ←
          </button>

          <div>
            <span class="eyebrow">
              Xyniva Ministry Studio
            </span>

            <h1>
              Bible Study Generator
            </h1>

            <p>
              Create a structured Bible study with
              teaching sections, discussion questions,
              application and a closing prayer prompt.
            </p>
          </div>

        </div>
      </div>

      <div class="xyniva-workspace">

        <div class="action-card">

          <h3>
            Study Direction
          </h3>

          <label for="studyScripture">
            Scripture
          </label>

          <input
            id="studyScripture"
            type="text"
            maxlength="500"
            placeholder="Example: Romans 8:1–17"
          >

          <label for="studyTopic">
            Topic
          </label>

          <input
            id="studyTopic"
            type="text"
            maxlength="500"
            placeholder="Example: Life in the Spirit"
          >

          <label for="studyAudience">
            Audience
          </label>

          <input
            id="studyAudience"
            type="text"
            maxlength="500"
            placeholder="Example: Young adults"
          >

          <label for="studyDenomination">
            Denomination / tradition
          </label>

          <select id="studyDenomination">
            <option value="general">General Christian</option>
            <option value="pentecostal">Pentecostal</option>
            <option value="baptist">Baptist</option>
            <option value="reformed">Reformed</option>
            <option value="catholic">Catholic</option>
            <option value="methodist">Methodist</option>
            <option value="presbyterian">Presbyterian</option>
            <option value="charismatic">Charismatic</option>
          </select>

          <label for="studyLength">
            Session length
          </label>

          <select id="studyLength">
            <option value="30">30 minutes</option>
            <option value="45">45 minutes</option>
            <option value="60" selected>60 minutes</option>
            <option value="75">75 minutes</option>
            <option value="90">90 minutes</option>
            <option value="120">120 minutes</option>
          </select>

          <label for="studyContext">
            Ministry context
          </label>

          <textarea
            id="studyContext"
            rows="3"
            maxlength="2000"
            placeholder="Optional church, group or ministry context"
          ></textarea>

          <button
            id="studyGenerateBtn"
            type="button"
            class="btn-primary"
            onclick="generateBibleStudy()"
          >
            ✨ Create Bible Study
          </button>

          <div
            id="studyStatus"
            role="status"
            aria-live="polite"
            hidden
          ></div>

        </div>

        <div
          id="studyOutput"
          aria-live="polite"
          hidden
        ></div>

      </div>

    </section>

  </div>
</div>
