services:

  db:
    image: pgvector/pgvector:pg16
    container_name: xynapse-db
    restart: always

    environment:
      POSTGRES_DB: xynapse
      POSTGRES_USER: xynapse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xynapse -d xynapse"]
      interval: 5s
      timeout: 5s
      retries: 10


  api:
    build: .
    container_name: xynapse-api
    restart: always

    depends_on:
      db:
        condition: service_healthy   # 🔥 THIS IS THE FIX

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql+psycopg2://xynapse:${POSTGRES_PASSWORD}@db:5432/xynapse
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      XYNASSIST_ENABLED: ${XYNASSIST_ENABLED:-false}
      XYNASSIST_BASE_URL: ${XYNASSIST_BASE_URL:-http://localhost:8001}
      XYNASSIST_TIMEOUT_SECONDS: ${XYNASSIST_TIMEOUT_SECONDS:-60}
      XYNASSIST_SERVICE_TOKEN: ${XYNASSIST_SERVICE_TOKEN:?XYNASSIST_SERVICE_TOKEN is required}
    working_dir: /workspaces/xynasoft-xynapse

    command: >
      python -m uvicorn main:app --host 0.0.0.0 --port 8000


volumes:
  pgdata: