databases:
- name: xynafaith-v2-preview-db
  databaseName: xynafaith_v2_preview
  user: xynafaith_preview
  plan: 0.5c-1g
services:
- type: web
  name: xynafaith-v2-preview
  plan: 1c-2g
  branch: release/xynafaith-v2-render-preview
  runtime: docker
  dockerfilePath: ./Dockerfile.render-v2
  dockerContext: .
  healthCheckPath: /preview-health
  autoDeployTrigger: 'off'
  envVars:
  - key: SECRET_KEY
    generateValue: true
  - key: DATABASE_URL
    fromDatabase:
      name: xynafaith-v2-preview-db
      property: connectionString
  - key: XYNASSIST_ENABLED
    value: 'false'
  - key: PREVIEW_USERNAME
    sync: false
  - key: PREVIEW_PASSWORD
    sync: false
